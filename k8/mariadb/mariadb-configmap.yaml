apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init
data:
  init.sql: |
    -- Check if the database exists
    SET @db_exists := (SELECT COUNT(*) FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME = 'ecomdb');

    -- Only create and initialize if it doesn't exist
    SET @sql := IF(@db_exists = 0,
      'CREATE DATABASE ecomdb; USE ecomdb; CREATE TABLE products (
          id mediumint(8) unsigned NOT NULL auto_increment,
          Name varchar(255) default NULL,
          Price varchar(255) default NULL,
          ImageUrl varchar(255) default NULL,
          PRIMARY KEY (id)
      ) AUTO_INCREMENT=1; INSERT INTO products (Name,Price,ImageUrl) VALUES
          (''Laptop'',''100'',''c-1.png''),
          (''Drone'',''200'',''c-2.png''),
          (''VR'',''300'',''c-3.png''),
          (''Tablet'',''50'',''c-5.png''),
          (''Watch'',''90'',''c-6.png''),
          (''Phone Covers'',''20'',''c-7.png''),
          (''Phone'',''80'',''c-8.png''),
          (''Laptop'',''150'',''c-4.png'');',
      'SELECT 1;' -- do nothing if db exists
    );

    -- Execute the conditional SQL
    PREPARE stmt FROM @sql;
    EXECUTE stmt;
    DEALLOCATE PREPARE stmt;